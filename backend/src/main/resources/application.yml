spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/copat_evalua
    username: copat
    password: copat
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: America/Santiago

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: false

copat:
  zona: America/Santiago
