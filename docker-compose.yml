services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copat_evalua
      POSTGRES_USER: copat
      POSTGRES_PASSWORD: copat
      TZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - copat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copat -d copat_evalua"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  copat_pg:
